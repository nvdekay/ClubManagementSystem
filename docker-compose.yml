services:
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27017:27017" # localhost only — never expose an auth-less Mongo to the network
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongo-data:
