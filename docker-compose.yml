services:
  mongo:
    image: mongo:7
    # Single-node replica set — the repositories use multi-document transactions.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017" # localhost only — never expose an auth-less Mongo to the network
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      # Initiates the replica set on first boot; healthy only once this node is primary.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }) }; quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongo-data:
