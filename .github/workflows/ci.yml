name: CI
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans full history — only this job needs it
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # No Mongo service here on purpose: a "unit" test that touches the DB fails in this job
  # (integration tests skip without MONGO_URI). Runs the same gate as local: npm run check.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Latest Node 22 release; package.json engines (and react-router 8) need >=22.22.
          node-version: '22.x'
          cache: npm
      - run: npm ci
      # Fails on a high or critical advisory in a runtime dependency; dev tooling is not shipped.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run build --workspaces

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same replica-set Mongo as local dev — a services: container cannot pass --replSet.
      - run: docker compose up -d --wait mongo
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run test:integration --workspace=server
        env:
          MONGO_URI: mongodb://localhost:27017/app

  # Builds the production image (not pushed) so a Dockerfile or build-context break fails the PR.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ucms:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Playwright UI tests against the real server and a seeded e2e database (client/e2e/README.md).
  # Kept out of `npm run check` so the main gate stays fast.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --wait mongo
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: client
      # The API serves the built client itself, so the suite also runs under the production CSP.
      - run: npm run test:e2e
        env:
          E2E_SERVE_BUILD: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            client/e2e/playwright-report/
            client/e2e/test-results/
          retention-days: 7
