="normal" text-anchor="middle" fill="#333333">Yes</text><rect x="539.2" y="1879.0" width="161.8" height="20" fill="#ffffff" opacity="0.94"/><text x="620.1" y="1893.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">Returned with comments</text><rect x="798.0" y="1953.0" width="72.1" height="20" fill="#ffffff" opacity="0.94"/><text x="834.0" y="1967.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">Confirmed</text><rect x="497.8" y="2359.0" width="203.2" height="52" fill="#ffffff" opacity="0.94"/><text x="599.4" y="2374.8" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">Maintained: the club keeps</text><text x="599.4" y="2389.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">operating (next recruitment,</text><text x="599.4" y="2403.6" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">next term)</text><rect x="798.0" y="2465.0" width="141.1" height="20" fill="#ffffff" opacity="0.94"/><text x="868.5" y="2479.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">Suspend or dissolve</text><circle cx="267.0" cy="238.0" r="17" fill="#333333"/><text x="292.0" y="242.2" font-size="12" font-weight="normal" text-anchor="start" fill="#000000">Start</text><rect x="164.0" y="327.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="267.0" y="362.8" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Prepare and submit the club</text><text x="267.0" y="378.4" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">founding application</text><rect x="688.0" y="455.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="791.0" y="490.8" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Review the founding</text><text x="791.0" y="506.4" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">application</text><polygon points="707.0,622.0 791.0,576.0 875.0,622.0 791.0,668.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.3"/><text x="791.0" y="626.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">Decision?</text><circle cx="1053.0" cy="622.0" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><circle cx="1053.0" cy="622.0" r="11" fill="#333333"/><text x="1053.0" y="655.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000">Rejected</text><rect x="950.0" y="711.0" width="206" height="78" rx="10" fill="#eeeeee" stroke="#666666" stroke-width="1.3"/><text x="1053.0" y="746.8" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Create the club in Pending</text><text x="1053.0" y="762.4" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Setup and notify the founder</text><rect x="426.0" y="839.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="529.0" y="866.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Set up the club profile and</text><text x="529.0" y="882.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">departments, nominate the</text><text x="529.0" y="898.1" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">board</text><rect x="688.0" y="967.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="791.0" y="1010.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Confirm the board</text><rect x="950.0" y="967.0" width="206" height="78" rx="10" fill="#eeeeee" stroke="#666666" stroke-width="1.3"/><text x="1053.0" y="1002.8" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Activate the club and open</text><text x="1053.0" y="1018.4" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">its first term</text><rect x="426.0" y="1095.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="529.0" y="1138.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Open a recruitment campaign</text><rect x="164.0" y="1223.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="267.0" y="1266.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Apply to join the club</text><rect x="426.0" y="1351.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="529.0" y="1386.8" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Screen, evaluate and decide</text><text x="529.0" y="1402.3" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">on applicants</text><polygon points="445.0,1518.0 529.0,1472.0 613.0,1518.0 529.0,1564.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.3"/><text x="529.0" y="1522.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">Accepted?</text><circle cx="267.0" cy="1518.0" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><circle cx="267.0" cy="1518.0" r="11" fill="#333333"/><text x="267.0" y="1551.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000">Not admitted</text><rect x="426.0" y="1607.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="529.0" y="1635.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Onboard and manage members</text><text x="529.0" y="1650.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">(departments, status,</text><text x="529.0" y="1666.2" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">withdrawals)</text><rect x="935.0" y="1348.0" width="236" height="84" fill="#fffbe6" stroke="#b8a44a"/><text x="1053.0" y="1372.6" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000" font-style="italic">Opens and closes the application</text><text x="1053.0" y="1387.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000" font-style="italic">window on schedule; notifies</text><text x="1053.0" y="1401.4" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000" font-style="italic">applicants and members after each</text><text x="1053.0" y="1415.8" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000" font-style="italic">decision</text><rect x="426.0" y="1735.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="529.0" y="1763.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Run the term; near its end</text><text x="529.0" y="1778.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">prepare the leadership</text><text x="529.0" y="1794.2" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">transition plan</text><polygon points="707.0,1902.0 791.0,1856.0 875.0,1902.0 791.0,1948.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.3"/><text x="791.0" y="1898.8" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">Transition</text><text x="791.0" y="1914.3" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">confirmed?</text><rect x="950.0" y="1991.0" width="206" height="78" rx="10" fill="#eeeeee" stroke="#666666" stroke-width="1.3"/><text x="1053.0" y="2019.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Close the old term, open the</text><text x="1053.0" y="2034.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">new term and hand the leader</text><text x="1053.0" y="2050.2" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">role to the new board</text><rect x="426.0" y="2119.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="529.0" y="2162.6" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Submit periodic reports</text><rect x="164.0" y="2247.0" width="206" height="78" rx="10" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.3" stroke-dasharray="6 4"/><text x="267.0" y="2282.8" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">File a complaint about the</text><text x="267.0" y="2298.3" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">club (when needed)</text><rect x="688.0" y="2247.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="791.0" y="2275.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Assess reports, handle</text><text x="791.0" y="2290.6" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">complaints and violations,</text><text x="791.0" y="2306.2" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">evaluate the club</text><polygon points="707.0,2414.0 791.0,2368.0 875.0,2414.0 791.0,2460.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.3"/><text x="791.0" y="2410.8" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">Lifecycle</text><text x="791.0" y="2426.3" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">decision?</text><rect x="950.0" y="2503.0" width="206" height="78" rx="10" fill="#eeeeee" stroke="#666666" stroke-width="1.3"/><text x="1053.0" y="2531.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Apply the suspension or</text><text x="1053.0" y="2546.6" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">dissolution, cancel pending</text><text x="1053.0" y="2562.2" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">activities and notify</text><circle cx="1053.0" cy="2670.0" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><circle cx="1053.0" cy="2670.0" r="11" fill="#333333"/><text x="1053.0" y="2704.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000">Club suspended</text><text x="1053.0" y="2718.4" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000">or dissolved</text></svg>