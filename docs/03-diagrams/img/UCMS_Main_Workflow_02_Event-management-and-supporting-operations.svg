t="normal" text-anchor="middle" fill="#333333">Rejected</text><rect x="798.0" y="929.0" width="65.2" height="20" fill="#ffffff" opacity="0.94"/><text x="830.6" y="943.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">Approved</text><rect x="546.1" y="2135.0" width="154.9" height="20" fill="#ffffff" opacity="0.94"/><text x="623.6" y="2149.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">Returned for revision</text><rect x="798.0" y="2209.0" width="65.2" height="20" fill="#ffffff" opacity="0.94"/><text x="830.6" y="2223.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">Findings</text><rect x="881.0" y="2135.0" width="65.2" height="20" fill="#ffffff" opacity="0.94"/><text x="913.6" y="2149.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#333333">Accepted</text><circle cx="529.0" cy="238.0" r="17" fill="#333333"/><text x="554.0" y="242.2" font-size="12" font-weight="normal" text-anchor="start" fill="#000000">Start</text><rect x="426.0" y="327.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="529.0" y="354.9" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Plan the event and submit the</text><text x="529.0" y="370.6" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">proposal (with a budget when</text><text x="529.0" y="386.1" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">funding is needed)</text><rect x="950.0" y="455.0" width="206" height="78" rx="10" fill="#eeeeee" stroke="#666666" stroke-width="1.3"/><text x="1053.0" y="490.8" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Check schedule and venue</text><text x="1053.0" y="506.4" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">conflicts</text><polygon points="969.0,622.0 1053.0,576.0 1137.0,622.0 1053.0,668.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.3"/><text x="1053.0" y="618.8" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">ICPDP approval</text><text x="1053.0" y="634.4" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">needed?</text><rect x="688.0" y="711.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="791.0" y="746.8" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Review the proposal and its</text><text x="791.0" y="762.4" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">budget</text><polygon points="707.0,878.0 791.0,832.0 875.0,878.0 791.0,924.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.3"/><text x="791.0" y="882.5" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">Decision?</text><circle cx="1013.0" cy="878.0" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><circle cx="1013.0" cy="878.0" r="11" fill="#333333"/><text x="1013.0" y="911.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000">Rejected</text><rect x="426.0" y="967.0" width="206" height="78" rx="10" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.3" stroke-dasharray="6 4"/><text x="529.0" y="1002.8" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Request facilities or</text><text x="529.0" y="1018.4" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">equipment (when needed)</text><rect x="688.0" y="1095.0" width="206" height="78" rx="10" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.3" stroke-dasharray="6 4"/><text x="791.0" y="1123.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Decide the facility request;</text><text x="791.0" y="1138.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">record the budget advance</text><text x="791.0" y="1154.2" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">(when budgeted)</text><rect x="426.0" y="1223.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="529.0" y="1258.8" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Publish the event and open</text><text x="529.0" y="1274.3" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">registration</text><rect x="164.0" y="1351.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="267.0" y="1386.8" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Register for the event</text><text x="267.0" y="1402.3" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">(waitlist when it is full)</text><rect x="950.0" y="1479.0" width="206" height="78" rx="10" fill="#eeeeee" stroke="#666666" stroke-width="1.3"/><text x="1053.0" y="1514.8" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Confirm seats, promote the</text><text x="1053.0" y="1530.3" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">waitlist and send reminders</text><rect x="164.0" y="1607.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="267.0" y="1650.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Attend the event</text><rect x="426.0" y="1607.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="529.0" y="1635.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Run the event, check</text><text x="529.0" y="1650.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">participants in and finalize</text><text x="529.0" y="1666.2" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">attendance</text><rect x="164.0" y="1735.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="267.0" y="1778.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Give feedback on the event</text><circle cx="267.0" cy="1902.0" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><circle cx="267.0" cy="1902.0" r="11" fill="#333333"/><text x="267.0" y="1936.0" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000">Feedback</text><text x="267.0" y="1950.4" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000">recorded</text><rect x="426.0" y="1863.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="529.0" y="1891.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Submit the post-event report</text><text x="529.0" y="1906.5" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">and the expense settlement</text><text x="529.0" y="1922.2" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">(when budgeted)</text><rect x="688.0" y="1991.0" width="206" height="78" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.3"/><text x="791.0" y="2026.8" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Assess the report and</text><text x="791.0" y="2042.3" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">reconcile the budget</text><polygon points="707.0,2158.0 791.0,2112.0 875.0,2158.0 791.0,2204.0" fill="#fff2cc" stroke="#d6b656" stroke-width="1.3"/><text x="791.0" y="2162.6" font-size="13" font-weight="bold" text-anchor="middle" fill="#000000">Accepted?</text><rect x="688.0" y="2247.0" width="206" height="78" rx="10" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.3" stroke-dasharray="6 4"/><text x="791.0" y="2282.8" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Open a violation case (when</text><text x="791.0" y="2298.3" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">there are findings)</text><rect x="950.0" y="2247.0" width="206" height="78" rx="10" fill="#eeeeee" stroke="#666666" stroke-width="1.3"/><text x="1053.0" y="2275.0" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">Close the event, settle the</text><text x="1053.0" y="2290.6" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">balance and feed the results</text><text x="1053.0" y="2306.2" font-size="13" font-weight="normal" text-anchor="middle" fill="#000000">into the club evaluation</text><circle cx="1053.0" cy="2414.0" r="17" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><circle cx="1053.0" cy="2414.0" r="11" fill="#333333"/><text x="1053.0" y="2447.2" font-size="12" font-weight="normal" text-anchor="middle" fill="#000000">Event closed</text></svg>