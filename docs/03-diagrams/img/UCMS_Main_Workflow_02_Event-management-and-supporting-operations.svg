" width="262" height="44" fill="#dfe7f1" stroke="#8a97a6"/><text x="791.0" y="157.6" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">ICPDP Officer</text><rect x="922" y="174" width="262" height="2304" fill="#f3f6fa" stroke="#8a97a6"/><rect x="922" y="130" width="262" height="44" fill="#dfe7f1" stroke="#8a97a6"/><text x="1053.0" y="157.6" font-size="16" font-weight="bold" text-anchor="middle" fill="#000000">UCMS (system)</text><rect x="40" y="174" width="46" height="384" fill="#33506e" stroke="#ffffff"/><text transform="translate(68.0,366.0) rotate(-90)" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Plan and propose</text><rect x="40" y="558" width="46" height="384" fill="#33506e" stroke="#ffffff"/><text transform="translate(68.0,750.0) rotate(-90)" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Review</text><line x1="86" y1="558" x2="1184" y2="558" stroke="#b0b8c2" stroke-dasharray="6 5"/><rect x="40" y="942" width="46" height="256" fill="#33506e" stroke="#ffffff"/><text transform="translate(68.0,1070.0) rotate(-90)" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Resources, when needed</text><line x1="86" y1="942" x2="1184" y2="942" stroke="#b0b8c2" stroke-dasharray="6 5"/><rect x="40" y="1198" width="46" height="384" fill="#33506e" stroke="#ffffff"/><text transform="translate(68.0,1390.0) rotate(-90)" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Publish and register</text><line x1="86" y1="1198" x2="1184" y2="1198" stroke="#b0b8c2" stroke-dasharray="6 5"/><rect x="40" y="1582" width="46" height="256" fill="#33506e" stroke="#ffffff"/><text transform="translate(68.0,1710.0) rotate(-90)" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Run and record</text><line x1="86" y1="1582" x2="1184" y2="1582" stroke="#b0b8c2" stroke-dasharray="6 5"/><rect x="40" y="1838" width="46" height="640" fill="#33506e" stroke="#ffffff"/><text transform